name: mazayada
description: تطبيق منصة مزايدة — المزادات الحكومية الجزائرية
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4

  # Functional / Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  equatable: ^2.0.5
  dartz: ^0.10.1 # Either<Failure, Success>

  # Networking
  dio: ^5.4.3+1
  dio_smart_retry: ^6.0.0 # إعادة محاولة الطلبات الفاشلة تلقائيًا
  pretty_dio_logger: ^1.4.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Local storage (tokens)
  flutter_secure_storage: ^9.2.2

  # UI
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.3.1
  gap: ^3.0.1 # مسافات نظيفة بدل SizedBox
  skeletonizer: ^1.4.2 # shimmer loading جاهز
  flutter_animate: ^4.5.0 # أنيميشن وميكرو-إنتراكشن بسطر واحد
  shimmer: ^3.0.0

  # Routing
  go_router: ^14.2.7 # تنقّل مركزي بدل MaterialPageRoute المبعثر

  # Forms & validation
  formz: ^0.7.0 # تحقق نظيف للحقول

  # Media / Files
  image_picker: ^1.1.2 # تصوير/اختيار مستندات الـ KYC (JPG/PNG فقط — قيد السيرفر)
  file_picker: ^8.1.2 # اختيار PDF لمستندات السجل التجاري (الـ KYC لا يقبل PDF)
  path_provider: ^2.1.4 # مجلد مؤقت لحفظ الوثائق المنزّلة
  open_filex: ^4.5.0 # فتح الـ PDF المنزّل بعارض النظام
  url_launcher: ^6.3.0 # فتح بوابة الدفع / الروابط
  webview_flutter: ^4.8.0 # بوابة الدفع داخل التطبيق

  # Connectivity
  connectivity_plus: ^6.0.5 # فحص الاتصال قبل الطلبات

  # Realtime & Notifications
  pusher_channels_flutter: ^2.2.1 # المزايدة اللحظية (broadcasting)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3 # Push notifications من السيرفر
  flutter_local_notifications: ^17.2.3 # عرض الإشعار والتطبيق مفتوح

  # Utils
  intl: ^0.20.2
  logger: ^2.4.0 # لوج منظّم
  flutter_gen: ^5.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # أيقونة التطبيق (تعديل العميل رقم 19) — تولّد أيقونات كل المنصّات من
  # ملف واحد. الأمر: `dart run flutter_launcher_icons`
  flutter_launcher_icons: ^0.14.4

  # Code generation
  build_runner: ^2.4.11
  freezed: ^4.0.1
  json_serializable: ^6.8.0
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
  generate: true # تفعيل توليد الترجمة (gen-l10n)

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/

  fonts:
    # خط Cairo متغيّر (variable font) يغطّي كل الأوزان 200–1000.
    # Flutter يختار الوزن المطلوب تلقائيًا حسب FontWeight.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont.ttf

# ===== أيقونة التطبيق (تعديل العميل رقم 19) =====
#
# الأصول بتتولّد من شعار العميل بـ`python3 tool/generate_logo_assets.py`
# (المصدر في `design/logo/`، منقول من الباك `public/images/brand/`).
# بعدها `dart run flutter_launcher_icons` بيولّد أيقونات Android وiOS كلها.
#
# `app_icon.png` **مربّع كامل ومعتم**: المنصّتين بيطبّقوا قناع الحواف
# بتاعهم، و`remove_alpha_ios` بيحوّل أي شفافية لأبيض — فأي حواف دائرية
# مخبّية في الصورة بتتقصّ مرتين وبتبان مثلثات بيضا في الأركان.
#
# `adaptive_icon_background` لازم يفضل نفس كحلي العلامة (`BRAND_NAVY` في
# السكربت)، عشان طبقتي الأيقونة التكيفية يبقوا قطعة واحدة.
flutter_launcher_icons:
  image_path: assets/logo/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#01152E"
  adaptive_icon_foreground: assets/logo/app_icon_foreground.png
